 name="msapplication-wide310x150logo" content="mstile-310x150.png"><meta name="msapplication-square310x310logo" content="mstile-310x310.png"><link rel="stylesheet" href="/css/prism.css" type="text/css"></head><body itemscope itemtype="https://schema.org/WebPage"><header itemscope itemtype="https://schema.org/WPHeader"><div class="logo"></div><h1><a href="/" alt="stan" title="stan" itemprop="headline">stan</a></h1><p itemprop="description">share everything</p><nav itemscope itemtype="https://schema.org/SiteNavigationElement"><ul><li itemprop="name"><a href="/ " alt="home" title="home" itemprop="url">home</a></li><li itemprop="name"><a href="/articles" alt="articles" title="articles" itemprop="url">articles</a></li><li itemprop="name"><a href="/author" alt="author" title="author" itemprop="url">author</a></li></ul></nav><div class="space"></div></header><main itemscope itemtype="https://schema.org/Blog"><article class="full"><h1 itemprop="headline" class="post-heading">lazyvim for java</h1><span class="page-tag-anchor"><a href="/tags/nvim" itemprop="url">#nvim

&nbsp;&nbsp;</a></span><span class="post-meta"></span><br><br><h2 id="lazyvim的java开发环境配置"><a href="#lazyvim的java开发环境配置" class="headerlink" title="lazyvim的java开发环境配置"></a>lazyvim的java开发环境配置</h2><figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br></pre></td><td class="code"><pre><span class="line">-- ~/.config/nvim/lua/plugins/java.lua</span><br><span class="line">return &#123;</span><br><span class="line">  &quot;mfussenegger/nvim-jdtls&quot;,</span><br><span class="line">  ft = &quot;java&quot;, -- 仅在打开 .java 文件时启动</span><br><span class="line">  config = function()</span><br><span class="line">    -- 1. 定位 mason 安装的工具路径（自动适配版本/路径）</span><br><span class="line">    local mason_path = vim.fn.glob(vim.fn.stdpath(&quot;data&quot;) .. &quot;/mason/packages/&quot;)</span><br><span class="line">    local jdtls_path = mason_path .. &quot;jdtls/&quot;</span><br><span class="line">    local java_debug_path = vim.fn.glob(mason_path .. &quot;java-debug-adapter/extension/server/com.microsoft.java.debug.plugin-0.53.2.jar&quot;)</span><br><span class="line"></span><br><span class="line">    -- 2. 确保 java-debug bundle 存在</span><br><span class="line">    if java_debug_path == &quot;&quot; then</span><br><span class="line">      vim.notify(&quot;java-debug-adapter 未安装，请执行 :MasonInstall java-debug-adapter&quot;, vim.log.levels.ERROR)</span><br><span class="line">      return</span><br><span class="line">    end</span><br><span class="line"></span><br><span class="line">    -- 3. jdtls 启动命令（适配 macOS + mason 路径）</span><br><span class="line">    local cmd = &#123;</span><br><span class="line">      jdtls_path .. &quot;bin/jdtls&quot;, -- jdtls 可执行文件路径</span><br><span class="line">      &quot;--jvm-arg=-javaagent:&quot; .. jdtls_path .. &quot;lombok.jar&quot;, -- 可选：支持 Lombok</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    -- 4. 找到 Java 项目根目录（必须有 mvnw/.gradlew/.git 之一）</span><br><span class="line">    local root_dir = vim.fs.dirname(vim.fs.find(&#123; &quot;.gradlew&quot;, &quot;.git&quot;, &quot;mvnw&quot; &#125;, &#123; upward = true &#125;)[1] or vim.fn.getcwd())</span><br><span class="line"></span><br><span class="line">    -- 5. jdtls 核心配置（加载调试 bundle）</span><br><span class="line">    local config = &#123;</span><br><span class="line">      cmd = cmd,</span><br><span class="line">      root_dir = root_dir,</span><br><span class="line">      init_options = &#123;</span><br><span class="line">        bundles = &#123; java_debug_path &#125;, -- 加载 java-debug 扩展（关键）</span><br><span class="line">      &#125;,</span><br><span class="line">      settings = &#123;</span><br><span class="line">        java = &#123;</span><br><span class="line">          configuration = &#123;</span><br><span class="line">            runtimes = &#123; -- 可选：指定 Java 运行时（若系统有多个版本）</span><br><span class="line">              &#123;</span><br><span class="line">                name = &quot;JavaSE-17&quot;,</span><br><span class="line">                path = &quot;/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home&quot;,</span><br><span class="line">              &#125;,</span><br><span class="line">            &#125;,</span><br><span class="line">          &#125;,</span><br><span class="line">        &#125;,</span><br><span class="line">      &#125;,</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    -- 6. 启动 jdtls + 关联 nvim-dap 调试</span><br><span class="line">    require(&quot;jdtls&quot;).start_or_attach(config)</span><br><span class="line">    require(&quot;jdtls&quot;).setup_dap(&#123; hotcodereplace = &quot;auto&quot; &#125;) -- 让 jdtls 给 nvim-dap 提供适配器</span><br><span class="line"></span><br><span class="line">    -- ========== 新增：快捷键触发生成 Java 调试配置 ==========</span><br><span class="line">    -- 定义生成调试配置的核心函数</span><br><span class="line">    local generate_java_dap_config = function()</span><br><span class="line">      -- 检查 jdtls 是否已正常启动（避免无意义执行）</span><br><span class="line">      local jdtls_clients = vim.lsp.get_active_clients(&#123; name = &quot;jdtls&quot; &#125;)</span><br><span class="line">      if #jdtls_clients == 0 then</span><br><span class="line">        vim.notify(&quot;JDTLS 未启动，请确保打开的是 Java 项目内的 .java 文件！&quot;, vim.log.levels.WARN)</span><br><span class="line">        return</span><br><span class="line">      end</span><br><span class="line">      -- 生成调试配置</span><br><span class="line">      require(&quot;jdtls.dap&quot;).setup_dap_main_class_configs()</span><br><span class="line">      vim.notify(&quot;Java 调试配置已生成 ✔️&quot;, vim.log.levels.INFO)</span><br><span class="line">    end</span><br><span class="line"></span><br><span class="line">    -- 绑定快捷键（&lt;leader&gt;dg 触发，仅在 Java 文件中生效）</span><br><span class="line">    -- leader 键默认是空格，即 空格 + d + g 执行生成操作</span><br><span class="line">    vim.keymap.set(</span><br><span class="line">      &quot;n&quot;,</span><br><span class="line">      &quot;&lt;leader&gt;dg&quot;,</span><br><span class="line">      generate_java_dap_config,</span><br><span class="line">      &#123;</span><br><span class="line">        noremap = true,</span><br><span class="line">        silent = true,</span><br><span class="line">        buffer = 0, -- 仅在当前 Java 文件缓冲区生效（避免全局冲突）</span><br><span class="line">        desc = &quot;生成 Java 调试配置&quot; -- 快捷键描述（兼容 which-key 菜单）</span><br><span class="line">      &#125;</span><br><span class="line">    )</span><br><span class="line">  end,</span><br><span class="line">  dependencies = &#123;</span><br><span class="line">    &quot;mfussenegger/nvim-dap&quot;,</span><br><span class="line">    &quot;rcarriga/nvim-dap-ui&quot;,</span><br><span class="line">  &#125;,</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>

<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br></pre></td><td class="code"><pre><span class="line">-- ~/.config/nvim/lua/plugins/dap.lua</span><br><span class="line">return &#123;</span><br><span class="line">  &quot;mfussenegger/nvim-dap&quot;,</span><br><span class="line">  config = function()</span><br><span class="line">    local dap = require(&#x27;dap&#x27;)</span><br><span class="line">    local dapui = require(&#x27;dapui&#x27;) -- 导入 dap-ui 模块（依赖已声明，可直接用）</span><br><span class="line"></span><br><span class="line">    -- 仅保留调试配置项（适配器由 nvim-jdtls 自动提供）</span><br><span class="line">    dap.configurations.java = &#123;</span><br><span class="line">      &#123;</span><br><span class="line">        type = &quot;java&quot;,</span><br><span class="line">        request = &quot;launch&quot;,</span><br><span class="line">        name = &quot;Launch Main Class&quot;,</span><br><span class="line">        mainClass = &quot;$&#123;file&#125;&quot;, -- 自动识别当前文件主类</span><br><span class="line">        projectName = &quot;$&#123;workspaceFolderBasename&#125;&quot;,</span><br><span class="line">      &#125;,</span><br><span class="line">      &#123;</span><br><span class="line">        type = &quot;java&quot;,</span><br><span class="line">        request = &quot;attach&quot;,</span><br><span class="line">        name = &quot;Debug (Attach) - Remote&quot;,</span><br><span class="line">        hostName = &quot;127.0.0.1&quot;,</span><br><span class="line">        port = 5005,</span><br><span class="line">      &#125;,</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line">    -- ========== 新增：调试核心快捷键（全局生效，Java 调试通用） ==========</span><br><span class="line">    local map_opts = &#123; noremap = true, silent = true &#125; -- 快捷键基础配置</span><br><span class="line">    local keymap = vim.keymap.set</span><br><span class="line"></span><br><span class="line">    -- 1. 断点相关</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;db&quot;, dap.toggle_breakpoint,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 切换断点&quot; &#125;))</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;dB&quot;, function()</span><br><span class="line">      dap.set_breakpoint(vim.fn.input(&quot;断点条件: &quot;)) -- 条件断点</span><br><span class="line">    end, vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 设置条件断点&quot; &#125;))</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;dr&quot;, dap.clear_breakpoints,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 清空所有断点&quot; &#125;))</span><br><span class="line"></span><br><span class="line">    -- 2. 调试流程控制</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;dc&quot;, dap.continue,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 启动/继续调试&quot; &#125;))</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;ds&quot;, dap.step_over,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 单步跳过（逐行执行）&quot; &#125;))</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;di&quot;, dap.step_into,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 单步进入（进入函数）&quot; &#125;))</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;do&quot;, dap.step_out,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 单步退出（退出函数）&quot; &#125;))</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;dq&quot;, dap.terminate,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 终止调试会话&quot; &#125;))</span><br><span class="line"></span><br><span class="line">    -- 3. DAP UI 控制（配合 rcarriga/nvim-dap-ui）</span><br><span class="line">    keymap(&quot;n&quot;, &quot;&lt;leader&gt;du&quot;, dapui.toggle,</span><br><span class="line">      vim.tbl_extend(&quot;force&quot;, map_opts, &#123; desc = &quot;DAP: 切换调试UI&quot; &#125;))</span><br><span class="line"></span><br><span class="line">    -- ========== 可选：自动联动 DAP UI（启动调试时打开，终止时关闭） ==========</span><br><span class="line">    dapui.setup() -- 初始化 dap-ui（默认布局，无需额外配置）</span><br><span class="line">    dap.listeners.after.event_initialized[&quot;dapui_config&quot;] = function()</span><br><span class="line">      dapui.open() -- 调试启动 → 自动打开 UI</span><br><span class="line">    end</span><br><span class="line">    dap.listeners.before.event_terminated[&quot;dapui_config&quot;] = function()</span><br><span class="line">      dapui.close() -- 调试终止 → 自动关闭 UI</span><br><span class="line">    end</span><br><span class="line">    dap.listeners.before.event_exited[&quot;dapui_config&quot;] = function()</span><br><span class="line">      dapui.close() -- 调试退出 → 自动关闭 UI</span><br><span class="line">    end</span><br><span class="line">  end,</span><br><span class="line">  dependencies = &#123; &quot;rcarriga/nvim-dap-ui&quot; &#125;,</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
